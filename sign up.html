
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up | AutoBar</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f6;
      color: #101114;
    }
    header {
      background: white;
      padding: 20px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }
    .brand {
      color: #e50914;
      font-size: 27px;
      font-weight: 900;
      text-decoration: none;
    }
    main {
      max-width: 540px;
      margin: 45px auto;
      padding: 30px 22px;
    }
    h1 { text-align: center; margin-bottom: 10px; }
    .intro {
      text-align: center;
      color: #646873;
      margin-bottom: 28px;
    }
    .choice {
      display: block;
      width: 100%;
      background: white;
      border: 2px solid #ddd;
      border-radius: 12px;
      padding: 19px;
      margin-bottom: 13px;
      text-align: left;
      cursor: pointer;
    }
    .choice.selected {
      border-color: #e50914;
      background: #fff7f7;
    }
    .choice strong {
      display: block;
      font-size: 17px;
      margin-bottom: 6px;
    }
    .choice span { color: #646873; font-size: 14px; }
    form {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin-top: 25px;
    }
    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }
    .submit {
      width: 100%;
      padding: 15px;
      margin-top: 22px;
      background: #e50914;
      color: white;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    .submit:disabled { opacity: .6; cursor: wait; }
    #message {
      margin-top: 16px;
      line-height: 1.5;
      text-align: center;
    }
    .signin {
      text-align: center;
      margin-top: 22px;
    }
    a { color: #e50914; }
    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<header>
  <a class="brand" href="index.html">AUTO BAR</a>
</header>

<main>
  <h1>Create Your AutoBar Account</h1>
  <p class="intro">How would you like to use AutoBar?</p>

  <button class="choice" type="button" data-role="customer">
    <strong>I'm a Customer</strong>
    <span>Discover deals, save coupons, and manage your wallet.</span>
  </button>

  <button class="choice" type="button" data-role="business">
    <strong>I'm a Business</strong>
    <span>Register your automotive business and publish offers.</span>
  </button>

  <button class="choice" type="button" data-role="affiliate">
    <strong>I'm an Affiliate</strong>
    <span>Promote AutoBar and explore partnership opportunities.</span>
  </button>

  <form id="signupForm">
    <h2>Account Information</h2>

    <label for="fullName">Full Name</label>
    <input id="fullName" type="text" required>

    <label for="email">Email Address</label>
    <input id="email" type="email" required>

    <label for="password">Password</label>
    <input id="password" type="password" minlength="8" required>

    <label for="confirmPassword">Confirm Password</label>
    <input id="confirmPassword" type="password" minlength="8" required>

    <button class="submit" id="submitButton" type="submit">
      Create Account
    </button>

    <p id="message" role="status"></p>
  </form>

  <p class="signin">Already have an account? <a href="login.html">Sign In</a></p>
  <a class="back" href="index.html">← Back to AutoBar</a>
</main>

<script>
  const SUPABASE_URL = "https://dcmrbmufxanqqfikimpb.supabase.co";

  // Copy your existing publishable key from index.html.
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5A8JQQ0n3sgN1Pxf32DqYw_vdAL-_rY";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  let selectedRole = "";

  document.querySelectorAll(".choice").forEach(button => {
    button.addEventListener("click", () => {
      selectedRole = button.dataset.role;

      document.querySelectorAll(".choice").forEach(choice => {
        choice.classList.remove("selected");
      });

      button.classList.add("selected");
    });
  });

  document.getElementById("signupForm").addEventListener("submit", async event => {
    event.preventDefault();

    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (!selectedRole) {
      message.textContent = "Please select an account type.";
      return;
    }

    if (password !== confirmPassword) {
      message.textContent = "Your passwords do not match.";
      return;
    }

    submitButton.disabled = true;
    message.textContent = "Creating your account...";

    const { error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: {
        emailRedirectTo: "https://shopautobar.com/",
        data: {
          full_name: fullName,
          account_type: selectedRole
        }
      }
    });

    submitButton.disabled = false;

    if (error) {
      message.textContent = error.message;
      return;
    }

    message.textContent =
      "Registration received! Please check your email to confirm your account.";
  });
</script>

</body>
</html>
